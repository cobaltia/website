name: Publish Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'Dockerfile'
      - '.github/workflows/publish.yml'
      - 'package.json'

jobs:
  Publish:
    name: Publish Docker Image
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: useblacksmith/setup-docker-builder@v1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push Docker Image
        uses: useblacksmith/build-push-action@v2
        with:
          push: true
          context: .
          tags: |
            ghcr.io/cobaltia/website:latest
            ghcr.io/cobaltia/website:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_CLIENT_ID=${{ secrets.NEXT_PUBLIC_CLIENT_ID }}
            NEXT_PUBLIC_BASE_WEB_URL=${{ vars.NEXT_PUBLIC_BASE_WEB_URL }}
            NEXT_PUBLIC_BASE_API_URL=${{ vars.NEXT_PUBLIC_BASE_API_URL }}
